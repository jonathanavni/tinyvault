<!doctype html>
<html lang="en"{{TV_DOCUMENT_ATTRIBUTE}}>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TinyVault benign login fixture</title>
  </head>
  <body>
    <main>
      <h1>Fixture login</h1>
      <form method="post" action="/login">
        <input id="runId" name="runId" type="hidden">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required{{TV_CONTROL_ATTRIBUTE}}>
        <button type="submit">Sign in</button>
      </form>
    </main>
    <script>
      document.querySelector('#runId').value = new URL(location.href).searchParams.get('runId') || '';
    </script>
  </body>
</html>
